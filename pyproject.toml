
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "api-automation-framework"
version = "0.1.0"
description = "API test automation framework"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "pydantic",
    "jsonschema",
    "pytest",
    "pytest-html",
    "responses",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]