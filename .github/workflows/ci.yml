name: API Automation CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 lint
        run: flake8 src/ tests/ --max-line-length=100 --exclude=.venv


  mocked-tests:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run mocked tests
        run: |
          pytest tests/mocked/ -v --tb=short \
            --html=reports/mocked-report.html \
            --self-contained-html

      - name: Upload mocked test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mocked-test-report
          path: reports/mocked-report.html


  integration-tests:
    needs: lint
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
      GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
      TIMEOUT: "10"
      PERFORMANCE_THRESHOLD: "1.5"

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run integration tests
        run: |
          pytest tests/integration/ tests/unit/ -v --tb=short \
            --html=reports/integration-report.html \
            --self-contained-html

      - name: Upload integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: reports/integration-report.html